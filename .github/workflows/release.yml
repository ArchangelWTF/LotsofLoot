name: Release

on:
  push:
    tags:
      # Version tags with a leading "v", e.g. v4.2.0
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (with or without leading v, e.g. v4.2.0)'
        required: true

env:
  ZIP_PREFIX: LotsofLootRedux
  PROJECT: LotsofLoot/LotsofLoot.csproj
  METADATA: LotsofLoot/LotsofLootModMetadata.cs
  DLL_PATH: Build/SPT_Runtime/user/mods/archangelwtf-lotsoflootredux/LotsofLoot.dll

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          # Tag is v-prefixed (e.g. v4.2.0); strip the v for the DLL version and zip name
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (tag v$VERSION)"

      - name: Determine SPT version
        id: spt
        shell: bash
        run: |
          # The package this mod builds against is what it is compatible with
          PKG=$(sed -n 's/.*Include="SPTarkov\.Server\.Core" Version="\([^"]*\)".*/\1/p' "$PROJECT")
          COMPAT=$(echo "$PKG" | cut -d. -f1,2)
          DECLARED=$(sed -n 's/.*public Range SptVersion { get; init; } = new("\([^"]*\)").*/\1/p' "$METADATA")
          echo "Package $PKG -> compat SPT $COMPAT (metadata declares '$DECLARED')"
          echo "compat=$COMPAT" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        id: package
        shell: bash
        run: |
          ZIP_NAME="$ZIP_PREFIX-${{ steps.version.outputs.version }}.zip"
          # Zip the contents of Build/ so the archive root holds SPT_Runtime/... (standard SPT layout)
          ( cd Build && zip -r "../$ZIP_NAME" . )
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: VirusTotal scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          # One path per line. Add more files here and each gets its own link below.
          files: |
            ${{ env.DLL_PATH }}

      - name: Build release notes
        id: notes
        shell: bash
        env:
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          {
            echo "notes<<EOF"
            echo "## Lots of Loot Redux ${{ steps.version.outputs.version }}"
            echo ""
            echo "_Changelog goes here._"
            echo ""
            # Read by the mod's own release feed, invisible on the rendered page
            echo "<!-- compat: SPT ${{ steps.spt.outputs.compat }} -->"
            echo ""
            echo "### VirusTotal"
            # The action outputs comma-separated "filepath=url" pairs, one per scanned file
            IFS=',' read -ra RESULTS <<< "$VT_ANALYSIS"
            for entry in "${RESULTS[@]}"; do
              [ -z "$entry" ] && continue
              name="${entry%%=*}"
              url="${entry#*=}"
              echo "- [\`$(basename "$name")\`]($url)"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: ${{ steps.package.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
